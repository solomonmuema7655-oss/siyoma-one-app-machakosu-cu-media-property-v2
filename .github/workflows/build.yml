name: Build SIYOMA CU Media V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q -o SIYOMA_ONE_APP-MACHAKOS_UNIVERSITY_CU_MEDIA_PROPERTY_V2.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Build APK
        run: |
          cd project/android
          ../../gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Check APK
        run: |
          test -f project/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: siyoma-one-app-cu-media-v2-debug-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
